const createAccessKey = (branchCode, accessCode) => {
  const source = `${branchCode.trim().toLowerCase()}::${accessCode.trim()}`;
  let h1 = 0xdeadbeef;
  let h2 = 0x41c6ce57;
  for (let i = 0; i < source.length; i++) {
    const ch = source.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return `${(h2 >>> 0).toString(36)}${(h1 >>> 0).toString(36)}`;
};

};

const isStoredHeadOfficeSetting = (setting) => {
  if (setting?.isHeadOffice) return true;
  const id = String(setting?.id || '');
  const name = String(setting?.name || '');
  if (!id.includes(HEAD_OFFICE_SETTING_CODE) && !name.includes(HEAD_OFFICE_SETTING_CODE)) return false;
  return setting?.accessKey === createAccessKey(id, HEAD_OFFICE_ACCESS_CODE);
};

const mergeHeadOfficeBranches = (remoteBranches) => {
  const map = new Map();
  getKnownHeadOfficeBranches().forEach((branch) => map.set(branch.appId, branch));
  remoteBranches.filter((branch) => !isHeadOfficeBranchRecord(branch)).forEach((branch) => map.set(branch.appId, branch));
  return Array.from(map.values()).sort((a, b) => String(a.branchName).localeCompare(String(b.branchName), 'ja'));
};

const getOffsetMonth = (monthStr, offset) => {
  const [y, m] = monthStr.split('-');
  const d = new Date(Number(y), Number(m) - 1 + offset, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
};

const getOrderAccountingMonth = (order) => order?.isCarryOver ? getOffsetMonth(order.targetMonth, 1) : order?.targetMonth;

const getFiscalYearMonths = (monthStr) => {
  const [y, m] = monthStr.split('-');
  let year = Number(y);
  if (Number(m) < 4) year -= 1;
  return Array.from({ length: 12 }, (_, i) => {
    const d = new Date(year, 3 + i, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  });
};

const getRankingPeriodMonths = (monthStr, period) => {
  const fiscalMonths = getFiscalYearMonths(monthStr);
  if (period === 'month') return [monthStr];
  if (period === 'q1') return fiscalMonths.slice(0, 3);
  if (period === 'q2') return fiscalMonths.slice(3, 6);
  if (period === 'q3') return fiscalMonths.slice(6, 9);
  if (period === 'q4') return fiscalMonths.slice(9, 12);
  if (period === 'firstHalf') return fiscalMonths.slice(0, 6);
  if (period === 'secondHalf') return fiscalMonths.slice(6, 12);
  return fiscalMonths;
};

const loadScript = (src) =>
  new Promise((resolve, reject) => {
    const existing = document.querySelector(`script[src="${src}"]`);
    if (existing) {
      if (existing.dataset.loaded === 'true') resolve();
      existing.addEventListener('load', resolve);
      existing.addEventListener('error', reject);
      return;
    }
    const script = document.createElement('script');
    script.src = src;
    script.onload = () => {
      script.dataset.loaded = 'true';
      resolve();
    };
    script.onerror = reject;
    document.head.appendChild(script);
  });

const AutoSaveInput = React.memo(({ value, onSave, saveId, saveField, type = 'text', className = '', placeholder = '' }) => {
  const [localVal, setLocalVal] = useState(value ?? (type === 'number' ? 0 : ''));
  const isEditing = useRef(false);
  const timerRef = useRef(null);

  useEffect(() => {
    if (!isEditing.current) setLocalVal(value ?? (type === 'number' ? 0 : ''));
  }, [value, type]);

  useEffect(() => () => timerRef.current && clearTimeout(timerRef.current), []);

  const save = useCallback(
    (next) => {
      const finalValue = next === '' && type === 'number' ? 0 : next;
      if (saveId !== undefined && saveField !== undefined) onSave(saveId, saveField, finalValue);
      else onSave(finalValue);
      setTimeout(() => {
        isEditing.current = false;
      }, 900);
    },
    [onSave, saveField, saveId, type]
  );

  const onChange = (e) => {
    isEditing.current = true;
    const next = type === 'number' ? (e.target.value === '' ? '' : Number(e.target.value)) : e.target.value;
    setLocalVal(next);
    if (timerRef.current) clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => save(next), 700);
  };

  const onBlur = () => {
    if (timerRef.current) clearTimeout(timerRef.current);
    save(localVal);
  };

  return (
    <input
      type={type}
      value={localVal === 0 && type === 'number' ? '' : localVal}
      onChange={onChange}
      onBlur={onBlur}
      onKeyDown={(e) => e.key === 'Enter' && e.currentTarget.blur()}
      placeholder={placeholder}
      {...(type === 'text' ? JAPANESE_TEXT_INPUT_PROPS : {})}
      className={className}
    />
  );
});

const StackedBarChart = ({ data, previousData, labels, title, unit, isAmount, yAxisMax, currentMonth }) => {
  const width = 800;
  const height = 260;
  const paddingX = 65;
  const paddingTop = 18;
  const paddingBottom = 48;
  const plotHeight = height - paddingTop - paddingBottom;
  const totals = data.map((d) => d.total);
  const previousTotals = previousData.map((d) => d.total);
  const maxValue = yAxisMax || Math.max(...totals, ...previousTotals, 1);
  const currentIndex = labels.findIndex((label) => label === currentMonth);
  const displayValue = currentIndex >= 0 ? totals[currentIndex] : 0;
  const step = (width - paddingX * 2) / Math.max(labels.length, 1);
  const barWidth = Math.min(34, step * 0.42);
  const previousBarWidth = Math.min(28, step * 0.34);
  const sourceSegments = [
    { key: 'houkatsu', label: '包括', color: '#60a5fa' },
    { key: 'kyotaku', label: '居宅', color: '#34d399' },
    { key: 'other', label: 'その他', color: '#cbd5e1' }
  ];
  const yFor = (value) => paddingTop + plotHeight - (Math.min(value, maxValue) / maxValue) * plotHeight;
  const hFor = (value) => Math.max(0, (Math.min(value, maxValue) / maxValue) * plotHeight);

  return (
    <Card className="flex flex-col h-full bg-gradient-to-b from-white to-slate-50/20">
      <h4 className="text-[10px] font-bold text-slate-600 uppercase tracking-widest leading-none mb-1">{title}</h4>
      <div className="flex items-end justify-between gap-3 mb-2">
        <div className="text-2xl font-bold text-blue-600 leading-none">{isAmount ? `¥${displayValue.toLocaleString()}` : `${displayValue}${unit}`}</div>
        <div className="flex items-center gap-3 text-[10px] font-bold text-slate-600">
          {sourceSegments.slice(0, 2).map((s) => <span key={s.key} className="inline-flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-sm" style={{ backgroundColor: s.color }} />{s.label}</span>)}
          <span className="inline-flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-sm bg-slate-300 opacity-60" />前年</span>
        </div>
      </div>
      <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto overflow-visible">
        {[0, 0.5, 1].map((ratio) => {
          const y = paddingTop + plotHeight - ratio * plotHeight;
          const val = maxValue * ratio;
          return <g key={ratio}><line x1={paddingX} y1={y} x2={width - paddingX + 15} y2={y} stroke="#e2e8f0" strokeWidth="1" strokeDasharray="4 4" /><text x={paddingX - 12} y={y + 5} textAnchor="end" fontSize="15" fill="#334155" fontWeight="900">{isAmount ? `${Math.floor(val / 1000).toLocaleString()}千円` : Math.round(val)}</text></g>;
        })}
        {data.map((item, i) => {
          const xCenter = paddingX + step * i + step / 2;
          const prev = previousData[i] || { total: 0 };
          const prevHeight = hFor(prev.total);
          let stacked = 0;
          return (
            <g key={labels[i]}>
              <rect x={xCenter - previousBarWidth / 2 - barWidth * 0.55} y={paddingTop + plotHeight - prevHeight} width={previousBarWidth} height={prevHeight} rx="3" fill="#94a3b8" opacity="0.28" />
              {sourceSegments.map((segment) => {
                const value = item[segment.key] || 0;
                const segHeight = hFor(stacked + value) - hFor(stacked);
                const y = yFor(stacked + value);
                stacked += value;
                if (!segHeight) return null;
                return <rect key={segment.key} x={xCenter - barWidth / 2 + barWidth * 0.35} y={y} width={barWidth} height={segHeight} rx="3" fill={segment.color} />;
              })}
              {item.total > maxValue && <text x={xCenter + barWidth * 0.35} y={paddingTop - 4} textAnchor="middle" fontSize="12" fill="#ef4444" fontWeight="900">{isAmount ? `${Math.floor(item.total / 1000).toLocaleString()}千` : item.total}</text>}
              <text x={xCenter} y={height - 12} textAnchor="middle" fontSize="15" fill="#334155" fontWeight="900">{Number(labels[i]?.split('-')[1])}月</text>
            </g>
          );
        })}
      </svg>
    </Card>
  );
};

const pdfProgressValue = (p, col, kind) => {
  const metric = p.current[col.key];
  return col.isAmount ? `${metric[`${kind}Cnt`]}件/${yenK(metric[`${kind}Amt`])}千円` : metric[`${kind}Cnt`];
};

const chunkArray = (items, size) => {
  const chunks = [];
  for (let i = 0; i < items.length; i += size) chunks.push(items.slice(i, i + size));
  return chunks;
};

    await setDoc(doc(db, ...basePath, 'orders', newId), { ...data, targetMonth: currentMonth, salespersonId: entryStaffId, amount: finalAmount, createdAt: new Date().toISOString() });
    showMessage('登録しました');
  }, [basePath, currentMonth, entryStaffId, showMessage]);

  const handleAddListRow = useCallback(async (category = RENTAL_CATEGORIES[0]) => {
    const targetStaffId = listStaffId === 'all' ? (salespersons[0]?.id || entryStaffId) : listStaffId;
    if (!targetStaffId) return showMessage('先にマスタ設定で担当者を追加してください');
    const newId = `order_${Date.now()}`;
    await setDoc(doc(db, ...basePath, 'orders', newId), {
      customerName: '',
      careHomeName: '',
      category,
      source: OTHER_SALES_CATS.includes(category) ? 'その他' : sources[0],
      amount: '',
      status: getStatusesByCategory(category)[0],
      isCarryOver: false,
      billingType: 'full',
      targetMonth: currentMonth,
      salespersonId: Number(targetStaffId),
      createdAt: new Date().toISOString()
    });
    showMessage(`${category === '特定福祉用具販売' ? '特定福祉用具' : category}に行を追加しました`);
  }, [basePath, currentMonth, entryStaffId, listStaffId, salespersons, showMessage]);

  const handleMoveStaff = useCallback(async (id, direction) => {
    const index = salespersons.findIndex((s) => s.id === id);
    const targetIndex = index + direction;
    if (targetIndex < 0 || targetIndex >= salespersons.length) return;
    const batch = writeBatch(db);
    batch.update(doc(db, ...basePath, 'staff', String(salespersons[index].id)), { orderIndex: targetIndex });
    batch.update(doc(db, ...basePath, 'staff', String(salespersons[targetIndex].id)), { orderIndex: index });
    await batch.commit();
  }, [basePath, salespersons]);

  const handleUpdateChartConfig = useCallback(async (group, field, value) => {
    const newConfig = { ...chartConfig, [group]: { ...chartConfig[group], [field]: value } };
    await setDoc(doc(db, ...basePath, 'config', 'settings'), newConfig);
  }, [basePath, chartConfig]);

  const handleExportData = useCallback(() => {
    const payload = {
      version: 1,
      exportedAt: new Date().toISOString(),
      branch: { id: BRANCH_ID, name: BRANCH_NAME },
      orders,
      salespersons,
      chartConfig
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `${BRANCH_NAME}_受注残進捗データ_${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
    showMessage('データを書き出しました');
  }, [BRANCH_ID, BRANCH_NAME, chartConfig, orders, salespersons, showMessage]);

  const commitImportOperations = useCallback(async (operations) => {
    for (let i = 0; i < operations.length; i += 400) {
      const batch = writeBatch(db);
      operations.slice(i, i + 400).forEach((operation) => operation(batch));
      await batch.commit();
    }
  }, []);

  const handleImportData = useCallback(async (event) => {
    const file = event.target.files?.[0];
    event.target.value = '';
    if (!file) return;
    try {
      const text = await file.text();
      const payload = JSON.parse(text);
      if (!Array.isArray(payload.orders) || !Array.isArray(payload.salespersons)) throw new Error('Invalid data');
      if (!window.confirm('現在のデータを読み込みファイルで上書きします。実行しますか？')) return;
      const operations = [];
      orders.forEach((order) => operations.push((batch) => batch.delete(doc(db, ...basePath, 'orders', order.id))));
      salespersons.forEach((staff) => operations.push((batch) => batch.delete(doc(db, ...basePath, 'staff', String(staff.id)))));
      payload.orders.forEach((order) => {
        if (!order?.id) return;
        const { id, ...data } = order;
        operations.push((batch) => batch.set(doc(db, ...basePath, 'orders', id), data));
      });
      payload.salespersons.forEach((staff, index) => {
        if (!staff?.id) return;
        operations.push((batch) => batch.set(doc(db, ...basePath, 'staff', String(staff.id)), { ...staff, orderIndex: staff.orderIndex ?? index }));
      });
      await commitImportOperations(operations);
      if (payload.chartConfig) await setDoc(doc(db, ...basePath, 'config', 'settings'), { ...DEFAULT_CHART_CONFIG, ...payload.chartConfig });
      showMessage('データを読み込みました');
    } catch (error) {
      console.error(error);
      showMessage('読み込みに失敗しました');
    }
  }, [basePath, commitImportOperations, orders, salespersons, showMessage]);

  const handleCarryOverChecked = useCallback(async () => {
    const nextMonth = getOffsetMonth(currentMonth, 1);
    const toCarry = listOrders.filter((o) => o.isCarryOver);
    if (!toCarry.length) return showMessage('対象がありません');
    const batch = writeBatch(db);
    toCarry.forEach((o) => batch.update(doc(db, ...basePath, 'orders', o.id), { targetMonth: nextMonth, isCarryOver: false }));
    await batch.commit();
    showMessage('次月へ移行しました');
  }, [basePath, currentMonth, listOrders, showMessage]);

  const summarize = useCallback((targetOrders) => {
    const init = () => ({ doneCnt: 0, doneAmt: 0, forecastCnt: 0, forecastAmt: 0, sourceCount: createSourceCount() });
    const summary = { rentalNew: init(), bed: init(), renovation: init(), equipment: init(), otherSales: init(), rentalBacklogTotalAmt: 0 };
    for (const o of targetOrders) {
      const key = CATEGORY_TO_KEY[o.category];
      const target = key ? summary[key] : null;
      const amt = Number(o.amount || 0);
      const done = isCompletedStatus(o.status);
      if (target) {
        target.forecastCnt += 1;
        target.forecastAmt += amt;
        if (o.source && target.sourceCount?.[o.source] !== undefined) target.sourceCount[o.source] += 1;
        if (done) {
          target.doneCnt += 1;
          target.doneAmt += amt;
        }
      }
      if (!done && RENTAL_CATEGORIES.includes(o.category)) summary.rentalBacklogTotalAmt += amt;
    }
    return summary;
  }, []);

  const branchSummary = useMemo(() => {
    const targetOrders = branchTotalSourceFilter === 'すべて' ? currentAccountingOrders : currentAccountingOrders.filter((o) => o.source === branchTotalSourceFilter);
    return summarize(targetOrders);
  }, [branchTotalSourceFilter, currentAccountingOrders, summarize]);

  const staffSummary = useCallback((sourceFilter = 'すべて') => {
    const targetOrders = sourceFilter === 'すべて' ? currentAccountingOrders : currentAccountingOrders.filter((o) => o.source === sourceFilter);
    const staffStats = {};
    salespersons.forEach((s) => {
      staffStats[s.id] = {
        rentalNew: { doneCnt: 0, doneAmt: 0, forecastCnt: 0, forecastAmt: 0, sourceCount: createSourceCount() },
        bed: { doneCnt: 0, doneAmt: 0, forecastCnt: 0, forecastAmt: 0, sourceCount: createSourceCount() },
        renovation: { doneCnt: 0, doneAmt: 0, forecastCnt: 0, forecastAmt: 0, sourceCount: createSourceCount() },
        equipment: { doneCnt: 0, doneAmt: 0, forecastCnt: 0, forecastAmt: 0, sourceCount: createSourceCount() },
        otherSales: { doneCnt: 0, doneAmt: 0, forecastCnt: 0, forecastAmt: 0, sourceCount: createSourceCount() },
        rentalBacklogTotalAmt: 0
      };
    });
    for (const o of targetOrders) {
      const stats = staffStats[Number(o.salespersonId)];
      if (!stats) continue;
      const amt = Number(o.amount || 0);
      const done = isCompletedStatus(o.status);
      if (!done && RENTAL_CATEGORIES.includes(o.category)) stats.rentalBacklogTotalAmt += amt;
      const key = CATEGORY_TO_KEY[o.category];
      if (!key) continue;
      stats[key].forecastCnt += 1;
      stats[key].forecastAmt += amt;
      if (o.source && stats[key].sourceCount?.[o.source] !== undefined) stats[key].sourceCount[o.source] += 1;
      if (done) {
        stats[key].doneCnt += 1;
        stats[key].doneAmt += amt;
      }
    }
    return salespersons.map((s) => ({ ...s, current: staffStats[s.id] }));
  }, [currentAccountingOrders, salespersons]);

  const branchTotalPersonDetailedSummary = useMemo(() => staffSummary(branchTotalSourceFilter), [branchTotalSourceFilter, staffSummary]);
  const personDetailedSummary = useMemo(() => staffSummary('すべて'), [staffSummary]);

  const trendData = useMemo(() => {
    const months = getFiscalYearMonths(currentMonth);
    const previousMonths = months.map((m) => getOffsetMonth(m, -12));
    const targetOrders = trendStaffId === 'overall' ? orders : orders.filter((o) => Number(o.salespersonId) === Number(trendStaffId));
    const emptyBars = () => Array.from({ length: 12 }, () => ({ total: 0, houkatsu: 0, kyotaku: 0, other: 0 }));
    const series = { rentalNew: emptyBars(), bed: emptyBars(), renovation: emptyBars(), equipment: emptyBars(), other: emptyBars() };
    const previousSeries = { rentalNew: emptyBars(), bed: emptyBars(), renovation: emptyBars(), equipment: emptyBars(), other: emptyBars() };
    const monthToIndex = Object.fromEntries(months.map((m, i) => [m, i]));
    const previousMonthToIndex = Object.fromEntries(previousMonths.map((m, i) => [m, i]));
    const addToSeries = (target, index, key, value, source) => {
      const sourceKey = source === '包括' ? 'houkatsu' : source === '居宅' ? 'kyotaku' : 'other';
      target[key][index].total += value;
      target[key][index][sourceKey] += value;
    };
    for (const o of targetOrders) {
      if (!isCompletedStatus(o.status)) continue;
      const cat = TREND_CAT_KEY[o.category];
      if (!cat) continue;
      const value = cat.isAmt ? Number(o.amount || 0) : 1;
      const accountingMonth = getOrderAccountingMonth(o);
      const index = monthToIndex[accountingMonth];
      if (index !== undefined) addToSeries(series, index, cat.key, value, o.source);
      const previousIndex = previousMonthToIndex[accountingMonth];
      if (previousIndex !== undefined) addToSeries(previousSeries, previousIndex, cat.key, value, o.source);
    }
    return { months, series, previousSeries };
  }, [currentMonth, orders, trendStaffId]);

  const rankingInsights = useMemo(() => {
    const months = new Set(getRankingPeriodMonths(currentMonth, rankingPeriod));
    const periodOrders = orders.filter((o) => months.has(getOrderAccountingMonth(o)));
    const filteredOrders = rankingStaffId === 'all' ? periodOrders : periodOrders.filter((o) => Number(o.salespersonId) === Number(rankingStaffId));
    const selectedStaffName = rankingStaffId === 'all' ? null : salespersons.find((staff) => Number(staff.id) === Number(rankingStaffId))?.name;
    const sourceTotal = (targetOrders) => {
      const total = createSourceCount();
      for (const order of targetOrders) {
        if (order.source && total[order.source] !== undefined) total[order.source] += 1;
      }
      return total;
    };
    const rankingMetrics = [
      { title: '新規レンタル件数', mode: 'count', filter: (o) => o.category === 'レンタル新規', value: () => 1 },
      { title: '新規レンタル金額合計', mode: 'amount', filter: (o) => o.category === 'レンタル新規', value: (o) => Number(o.amount || 0) },
      { title: '特価ベッド依頼数', mode: 'count', filter: (o) => o.category === '特価ベッド', value: () => 1 },
      { title: '特定福祉用具依頼数', mode: 'count', filter: (o) => o.category === '特定福祉用具販売', value: () => 1 },
      { title: '特定福祉用具金額合計', mode: 'amount', filter: (o) => o.category === '特定福祉用具販売', value: (o) => Number(o.amount || 0) },
      { title: '住宅改修依頼数', mode: 'count', filter: (o) => o.category === '住宅改修', value: () => 1 },
      { title: '住宅改修金額合計', mode: 'amount', filter: (o) => o.category === '住宅改修', value: (o) => Number(o.amount || 0) }
    ];
    const buildGroups = (targetOrders, rankBy = 'source') => rankingMetrics.map((metric) => {
      const map = {};
      const metricSourceCount = createSourceCount();
      for (const order of targetOrders) {
        if (!metric.filter(order)) continue;
        const key = rankBy === 'office' ? (order.careHomeName?.trim() || '未入力') : (order.source || 'その他');
        if (!map[key]) map[key] = { label: key, count: 0, amount: 0 };
        if (order.source && metricSourceCount[order.source] !== undefined) metricSourceCount[order.source] += 1;
        if (metric.mode === 'amount') {
          map[key].amount += metric.value(order);
          map[key].count += 1;
        } else {
          map[key].count += metric.value(order);
        }
      }
      const rows = Object.values(map)
        .sort((a, b) => metric.mode === 'amount' ? (b.amount - a.amount) || (b.count - a.count) : (b.count - a.count) || (b.amount - a.amount))
        .slice(0, 8);
      return { title: metric.title, rows, mode: metric.mode, sourceCount: metricSourceCount };
    });
    const pickGroups = (targetOrders) => ({ label: '事業所ランキング', groups: buildGroups(targetOrders, 'office') });
    const branchGroups = pickGroups(filteredOrders);
    return {
      periodLabel: getRankingPeriodLabel(rankingPeriod),
      branch: { title: `${BRANCH_NAME} ${selectedStaffName ? selectedStaffName : '営業所合計'}`, sourceCount: sourceTotal(filteredOrders), rankingLabel: branchGroups.label, groups: branchGroups.groups },
      personal: salespersons.filter((staff) => staff?.id).map((staff) => {
        const staffOrders = periodOrders.filter((o) => Number(o.salespersonId) === Number(staff.id));
        const staffGroups = pickGroups(staffOrders);
        return { id: staff.id, name: staff.name, sourceCount: sourceTotal(staffOrders), rankingLabel: staffGroups.label, groups: staffGroups.groups };
      })
    };
  }, [BRANCH_NAME, currentMonth, orders, rankingPeriod, rankingStaffId, salespersons]);

  const handleExportPDF = useCallback(async () => {
    if (isGeneratingPDF) return;
    const restoreZoom = zoomLevelRef.current;
    setIsGeneratingPDF(true);
    document.documentElement.classList.add('is-exporting-pdf');
    setZoomLevel(1);
    showMessage('印刷用データを準備しています...');
    try {
      await Promise.all([
        loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
        loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
      ]);
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      await new Promise((resolve) => setTimeout(resolve, 300));
      const pages = Array.from(document.querySelectorAll('.pdf-page'));
      if (!pages.length) throw new Error('PDF pages not found');
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4', compress: true });
      const pdfWidth = pdf.internal.pageSize.getWidth();
      const pdfPageHeight = pdf.internal.pageSize.getHeight();
      for (let i = 0; i < pages.length; i++) {
        const canvas = await window.html2canvas(pages[i], { scale: 2, useCORS: true, logging: false, backgroundColor: '#ffffff' });
        const imgData = canvas.toDataURL('image/jpeg', 0.95);
        if (i > 0) pdf.addPage();
        pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfPageHeight);
      }
      pdf.save(`${BRANCH_NAME}_進捗_${currentMonth}.pdf`);
      showMessage('印刷用PDFを保存しました');
    } catch (error) {
      console.error(error);
      showMessage('PDFの生成に失敗しました');
    } finally {
      document.documentElement.classList.remove('is-exporting-pdf');
      setZoomLevel(restoreZoom);
      setIsGeneratingPDF(false);
    }
  }, [BRANCH_NAME, currentMonth, isGeneratingPDF, showMessage]);

  if (isLoading) return <LoadingScreen />;

  const tabs = [
    { id: 'new_entry', label: '登録', icon: Plus },
    { id: 'list', label: '受注残一覧', icon: List },
    { id: 'branch_total', label: '営業所合計', icon: PieChart },
    { id: 'summary', label: '目標進捗', icon: BarChart3 },
    { id: 'trend', label: '推移グラフ', icon: LineChart },
    { id: 'compliance', label: '使い方', icon: Info },
    { id: 'master', label: 'マスタ設定', icon: Settings }
  ];

  return (
    <div id="app-root" className="min-h-screen bg-slate-50 text-slate-800 font-sans pb-12 antialiased" style={{ zoom: zoomLevel }}>
      {notification && <div className="fixed top-6 left-1/2 -translate-x-1/2 z-[100] px-6 py-3 rounded-xl shadow-xl font-bold text-sm bg-slate-900 text-white flex items-center gap-3 border border-white/10 print:hidden"><CheckCircle2 size={18} className="text-emerald-400" />{notification}</div>}
      <PDFTemplate branchName={BRANCH_NAME} currentMonth={currentMonth} branchSummary={branchSummary} branchTotalPersonDetailedSummary={branchTotalPersonDetailedSummary} />
      <header className="bg-white border-b border-slate-100 sticky top-0 z-50 shadow-sm print:hidden">
        <div className="max-w-6xl mx-auto px-5 h-20 flex items-center justify-between">
          <div className="flex items-center gap-4"><ShieldCheck size={32} className="text-blue-500 hidden sm:block" /><div><h1 className="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">受注残・進捗管理表</h1><p className="text-xs font-bold text-blue-500">{BRANCH_NAME}</p></div></div>
          <div className="flex items-center gap-3">
            <button onClick={handleResetBranchSetting} className="hidden sm:block text-xs font-bold text-slate-600 bg-slate-50 hover:bg-slate-100 border border-slate-200 px-3 py-2 rounded-xl">設定変更</button>
            <div className="hidden md:flex items-center bg-slate-50 rounded-xl p-1 shadow-inner border border-slate-200"><button onClick={() => setZoomLevel((p) => Math.max(0.6, p - 0.1))} className="p-1.5 text-slate-600 hover:text-blue-500 hover:bg-white rounded-lg"><ZoomOut size={16} /></button><span className="text-xs font-bold text-slate-800 w-10 text-center">{Math.round(zoomLevel * 100)}%</span><button onClick={() => setZoomLevel((p) => Math.min(1.5, p + 0.1))} className="p-1.5 text-slate-600 hover:text-blue-500 hover:bg-white rounded-lg"><ZoomIn size={16} /></button></div>
            <div className="flex items-center gap-2 bg-slate-50 px-3 sm:px-4 py-2 sm:py-2.5 rounded-xl shadow-inner border border-slate-200"><Calendar size={18} className="text-slate-500 hidden sm:block" /><input type="month" value={currentMonth} onChange={(e) => setCurrentMonth(e.target.value)} className="bg-transparent border-none text-sm sm:text-base font-bold text-slate-800 outline-none cursor-pointer" /></div>
          </div>
        </div>
      </header>
      <nav className="bg-white border-b border-slate-100 sticky top-20 z-40 shadow-sm print:hidden">
        <div className="max-w-6xl mx-auto flex overflow-x-auto h-16 sm:h-20">
          {tabs.map((tab) => <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex-1 flex flex-col items-center justify-center min-w-[90px] border-b-4 font-bold text-xs sm:text-base transition-all gap-1 sm:gap-2 ${activeTab === tab.id ? 'border-blue-400 text-blue-500 bg-blue-50/20' : 'border-transparent text-slate-600 hover:text-slate-800'}`}><tab.icon size={20} /><span>{tab.label}</span></button>)}
        </div>
      </nav>
      <main className="max-w-6xl mx-auto p-4 sm:p-6 space-y-6">
        {activeTab === 'new_entry' && <section className="space-y-6"><SectionHeader icon={Plus} title="新規案件登録" subtitle="New Entry" /><NewEntryForm salespersons={salespersons} onSubmit={handleEntrySubmit} selectedStaffId={entryStaffId} onStaffChange={setEntryStaffId} /><div className="space-y-4 pt-6"><h3 className="text-xl font-bold text-slate-800 flex items-center gap-2 px-2"><div className="w-2.5 h-6 bg-blue-400 rounded-full" />本日の登録内容</h3><OrderTable items={entryStaffOrders} onUpdate={updateOrderField} onDelete={deleteOrder} salespersons={salespersons} /></div></section>}
        {activeTab === 'branch_total' && <section className="space-y-4">
          <div className="flex justify-between items-start mb-2 print:hidden"><SectionHeader icon={PieChart} title={`${BRANCH_NAME} 合計・見込み`} subtitle="Branch Status" /><div className="flex items-center gap-2"><button onClick={handleExportPDF} disabled={isGeneratingPDF} className="bg-blue-600 text-white px-5 py-3 rounded-xl font-bold shadow-lg hover:bg-blue-700 flex items-center gap-3 disabled:opacity-50">{isGeneratingPDF ? <Loader2 size={20} className="animate-spin" /> : <FileDown size={20} />}印刷</button><button onClick={() => setShowBranchPreview(true)} className="bg-emerald-500 text-white px-4 py-2.5 rounded-xl font-bold text-sm shadow-md hover:bg-emerald-600 flex items-center gap-2"><Users size={18} />全体プレビュー</button></div></div>
          <BranchSourceFilter currentFilter={branchTotalSourceFilter} onChange={setBranchTotalSourceFilter} prefix="branch" /><BranchSummaryCards summary={branchSummary} /><BacklogTotalCard totalAmt={branchSummary.rentalBacklogTotalAmt} />
          <div className="flex bg-white p-2 rounded-xl border border-slate-200 shadow-sm gap-2 overflow-x-auto mt-8 mb-2 print:hidden"><button onClick={() => setBranchTotalStaffId('all')} className={`px-6 py-2 rounded-lg font-bold text-sm whitespace-nowrap ${branchTotalStaffId === 'all' ? 'bg-slate-700 text-white shadow' : 'text-slate-600 hover:bg-slate-50'}`}>全員表示</button>{salespersons.map((staff) => <button key={staff.id} onClick={() => setBranchTotalStaffId(staff.id)} className={`px-6 py-2 rounded-lg font-bold text-sm whitespace-nowrap ${branchTotalStaffId === staff.id ? 'bg-blue-500 text-white shadow' : 'text-slate-600 hover:bg-slate-50'}`}>{staff.name}</button>)}</div>
          <Card noPadding className="border border-slate-200 shadow-lg rounded-2xl overflow-hidden"><div className="bg-blue-500 text-white px-5 py-3 font-bold text-base uppercase tracking-widest flex items-center gap-3"><TrendingUp size={18} />進捗ステータス詳細</div><ProgressTable data={branchTotalPersonDetailedSummary} staffIdFilter={branchTotalStaffId} /></Card>
          {showBranchPreview && <PreviewModal onClose={() => setShowBranchPreview(false)} onExport={handleExportPDF} isGeneratingPDF={isGeneratingPDF} branchSummary={branchSummary} data={branchTotalPersonDetailedSummary} branchTotalSourceFilter={branchTotalSourceFilter} setBranchTotalSourceFilter={setBranchTotalSourceFilter} />}
        </section>}
        {activeTab === 'summary' && <section className="space-y-6"><div className="flex justify-between items-end"><SectionHeader icon={BarChart3} title={`${BRANCH_NAME} 目標進捗`} subtitle="Monthly Target" /><AlertNote /></div><RankingInsightsPanel insights={rankingInsights} salespersons={salespersons} period={rankingPeriod} setPeriod={setRankingPeriod} staffId={rankingStaffId} setStaffId={setRankingStaffId} /><div className="forecast-progress-print-hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">{personDetailedSummary.map((data) => <ProgressCard key={data.id} data={data} />)}</div></section>}

const SourceRatioPie = ({ title, sourceCount }) => {
  const houkatsu = Number(sourceCount?.['包括'] || 0);
  const kyotaku = Number(sourceCount?.['居宅'] || 0);
  const renkei = Number(sourceCount?.['退院/連携室'] || 0);
  const total = houkatsu + kyotaku + renkei;
  const houkatsuDeg = total ? (houkatsu / total) * 360 : 0;
  const kyotakuDeg = total ? (kyotaku / total) * 360 : 0;
  const chartStyle = {
    background: total
      ? `conic-gradient(#3b82f6 0deg ${houkatsuDeg}deg, #10b981 ${houkatsuDeg}deg ${houkatsuDeg + kyotakuDeg}deg, #64748b ${houkatsuDeg + kyotakuDeg}deg 360deg)`
      : '#e2e8f0'
  };
  const pct = (value) => total ? `${Math.round((value / total) * 100)}%` : '0%';
  return (
    <div className="bg-white border border-slate-100 rounded-xl p-4 flex items-center gap-4 min-w-0">
      <div className="w-24 h-24 rounded-full shrink-0 shadow-inner border border-slate-100" style={chartStyle} />
      <div className="min-w-0 flex-1">
        <div className="font-extrabold text-slate-900 text-sm mb-2 truncate">{title}</div>
        <div className="space-y-1 text-xs font-bold text-slate-700">
          <div className="flex justify-between gap-2"><span className="text-blue-600">包括</span><span>{houkatsu}件 / {pct(houkatsu)}</span></div>
          <div className="flex justify-between gap-2"><span className="text-emerald-600">居宅</span><span>{kyotaku}件 / {pct(kyotaku)}</span></div>
          <div className="flex justify-between gap-2"><span className="text-slate-600">連携室</span><span>{renkei}件 / {pct(renkei)}</span></div>
        </div>
      </div>
    </div>
  );
};

  rentalBacklogTotalAmt: 0
});

const addOrderToSummary = (summary, order) => {
  const key = CATEGORY_TO_KEY[order.category];
  const target = key ? summary[key] : null;
  const amount = Number(order.amount || 0);
  const done = isCompletedStatus(order.status);
  if (target) {
    target.forecastCnt += 1;
    target.forecastAmt += amount;
    if (order.source && target.sourceCount?.[order.source] !== undefined) target.sourceCount[order.source] += 1;
    if (done) {
      target.doneCnt += 1;
      target.doneAmt += amount;
    }
  }
  if (!done && RENTAL_CATEGORIES.includes(order.category)) summary.rentalBacklogTotalAmt += amount;
};

const HeadOfficeApp = () => {
  const [user, setUser] = useState(null);
  const [authInitialized, setAuthInitialized] = useState(false);
  const [branches, setBranches] = useState([]);
  const [branchData, setBranchData] = useState({});
  const [currentMonth, setCurrentMonth] = useState(() => {
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  });
  const [selectedBranch, setSelectedBranch] = useState('all');
  const [showRankings, setShowRankings] = useState(false);
  const [headRankingPeriod, setHeadRankingPeriod] = useState('month');
  const [headRankingStaffId, setHeadRankingStaffId] = useState('all');

  useEffect(() => {
    const initAuth = async () => {
      try {
        let signedIn = false;
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          try {
            await signInWithCustomToken(auth, __initial_auth_token);
            signedIn = true;
          } catch {}
        }
        if (!signedIn) await signInAnonymously(auth);
      } finally {
        setAuthInitialized(true);
      }
    };
    initAuth();
    return onAuthStateChanged(auth, setUser);
  }, []);

  useEffect(() => {
    if (!authInitialized || !user) return;
    return onSnapshot(collection(db, 'artifacts', HEAD_OFFICE_DIRECTORY_APP_ID, 'public', 'data', 'branches'), (snap) => {
      setBranches(mergeHeadOfficeBranches(snap.docs.map((d) => ({ ...d.data(), id: d.id }))));
    });
  }, [authInitialized, user]);

  useEffect(() => {
    if (!branches.length) {
      setBranchData({});
      return;
    }
    const unsubscribers = [];
    branches.forEach((branch) => {
      const appId = branch.appId;
      const base = ['artifacts', appId, 'public', 'data'];
      unsubscribers.push(onSnapshot(collection(db, ...base, 'orders'), (snap) => {
        setBranchData((prev) => ({ ...prev, [appId]: { ...(prev[appId] || {}), branch, orders: snap.docs.map((d) => ({ ...d.data(), id: d.id })) } }));
      }));
      unsubscribers.push(onSnapshot(collection(db, ...base, 'staff'), (snap) => {
        setBranchData((prev) => ({ ...prev, [appId]: { ...(prev[appId] || {}), branch, staff: snap.docs.map((d) => ({ ...d.data(), id: Number(d.id) })).sort((a, b) => (a.orderIndex ?? 0) - (b.orderIndex ?? 0)) } }));
      }));
    });
    return () => unsubscribers.forEach((unsubscribe) => unsubscribe());
  }, [branches]);

  const branchAppIdSet = useMemo(() => new Set(branches.map((branch) => branch.appId)), [branches]);
  const visibleBranchData = useMemo(() => Object.values(branchData).filter((item) => item?.branch && branchAppIdSet.has(item.branch.appId) && (selectedBranch === 'all' || item.branch.appId === selectedBranch)), [branchAppIdSet, branchData, selectedBranch]);
  const currentOrders = useMemo(() => visibleBranchData.flatMap((item) => (item.orders || []).filter((order) => getOrderAccountingMonth(order) === currentMonth).map((order) => ({ ...order, branchName: item.branch.branchName, appId: item.branch.appId }))), [currentMonth, visibleBranchData]);
  const allSummary = useMemo(() => {
    const summary = createEmptySummary();
    currentOrders.forEach((order) => addOrderToSummary(summary, order));
    return summary;
  }, [currentOrders]);
  const branchRows = useMemo(() => visibleBranchData.map((item) => {
    const orders = (item.orders || []).filter((order) => getOrderAccountingMonth(order) === currentMonth);
    const summary = createEmptySummary();
    orders.forEach((order) => addOrderToSummary(summary, order));
    return { ...item.branch, summary, orderCount: orders.length };
  }).sort((a, b) => b.summary.rentalBacklogTotalAmt - a.summary.rentalBacklogTotalAmt), [currentMonth, visibleBranchData]);
  const staffRows = useMemo(() => {
    const rows = [];
    visibleBranchData.forEach((item) => {
      const staff = item.staff || [];
      const orders = (item.orders || []).filter((order) => getOrderAccountingMonth(order) === currentMonth);
      staff.forEach((person) => {
        const summary = createEmptySummary();
        orders.filter((order) => Number(order.salespersonId) === Number(person.id)).forEach((order) => addOrderToSummary(summary, order));
        rows.push({ branchName: item.branch.branchName, staffName: person.name, summary });
      });
    });
    return rows.sort((a, b) => b.summary.rentalNew.forecastCnt - a.summary.rentalNew.forecastCnt || b.summary.rentalBacklogTotalAmt - a.summary.rentalBacklogTotalAmt);
  }, [currentMonth, visibleBranchData]);
  const headOfficeStaffOptions = useMemo(() => {
    const map = new Map();
    visibleBranchData.forEach((item) => (item.staff || []).forEach((person) => map.set(`${item.branch.appId}:${person.id}`, `${item.branch.branchName} / ${person.name}`)));
    return Array.from(map.entries()).map(([value, label]) => ({ value, label })).sort((a, b) => a.label.localeCompare(b.label, 'ja'));
  }, [visibleBranchData]);
  const rankingStaffRows = useMemo(() => {
    const months = new Set(getRankingPeriodMonths(currentMonth, headRankingPeriod));
    const rows = [];
    visibleBranchData.forEach((item) => {
      const staff = item.staff || [];
      const orders = (item.orders || []).filter((order) => months.has(getOrderAccountingMonth(order)));
      staff.forEach((person) => {
        const staffKey = `${item.branch.appId}:${person.id}`;
        if (headRankingStaffId !== 'all' && headRankingStaffId !== staffKey) return;
        const summary = createEmptySummary();
        orders.filter((order) => Number(order.salespersonId) === Number(person.id)).forEach((order) => addOrderToSummary(summary, order));
        rows.push({ branchName: item.branch.branchName, staffName: person.name, summary });
      });
    });
    return rows.sort((a, b) => b.summary.rentalNew.forecastCnt - a.summary.rentalNew.forecastCnt || b.summary.rentalBacklogTotalAmt - a.summary.rentalBacklogTotalAmt);
  }, [currentMonth, headRankingPeriod, headRankingStaffId, visibleBranchData]);
  const selectedBranchRow = useMemo(() => selectedBranch === 'all' ? null : branchRows.find((row) => row.appId === selectedBranch), [branchRows, selectedBranch]);
  const rankingRows = useMemo(() => {
    const activeRows = rankingStaffRows.filter((row) => row.summary.rentalNew.forecastCnt || row.summary.rentalNew.forecastAmt || row.summary.bed.forecastCnt || row.summary.renovation.forecastCnt || row.summary.renovation.forecastAmt || row.summary.equipment.forecastCnt || row.summary.equipment.forecastAmt);
    return {
      rentalNewCount: [...activeRows].sort((a, b) => b.summary.rentalNew.forecastCnt - a.summary.rentalNew.forecastCnt || b.summary.rentalNew.forecastAmt - a.summary.rentalNew.forecastAmt).slice(0, 10),
      rentalNewAmount: [...activeRows].sort((a, b) => b.summary.rentalNew.forecastAmt - a.summary.rentalNew.forecastAmt || b.summary.rentalNew.forecastCnt - a.summary.rentalNew.forecastCnt).slice(0, 10),
      bedCount: [...activeRows].sort((a, b) => b.summary.bed.forecastCnt - a.summary.bed.forecastCnt || b.summary.bed.forecastAmt - a.summary.bed.forecastAmt).slice(0, 10),
      equipmentCount: [...activeRows].sort((a, b) => b.summary.equipment.forecastCnt - a.summary.equipment.forecastCnt || b.summary.equipment.forecastAmt - a.summary.equipment.forecastAmt).slice(0, 10),
      equipmentAmount: [...activeRows].sort((a, b) => b.summary.equipment.forecastAmt - a.summary.equipment.forecastAmt || b.summary.equipment.forecastCnt - a.summary.equipment.forecastCnt).slice(0, 10),
      renovationCount: [...activeRows].sort((a, b) => b.summary.renovation.forecastCnt - a.summary.renovation.forecastCnt || b.summary.renovation.forecastAmt - a.summary.renovation.forecastAmt).slice(0, 10),
      renovationAmount: [...activeRows].sort((a, b) => b.summary.renovation.forecastAmt - a.summary.renovation.forecastAmt || b.summary.renovation.forecastCnt - a.summary.renovation.forecastCnt).slice(0, 10)
    };
  }, [rankingStaffRows]);
  const totalSalesForecast = allSummary.renovation.forecastAmt + allSummary.equipment.forecastAmt + allSummary.otherSales.forecastAmt;
  const handleReset = useCallback(() => {
    localStorage.removeItem('solar_silver_branch_setting');
    window.location.reload();
  }, []);

  if (!authInitialized || !user) return <LoadingScreen />;

  return (
    <div className="min-h-screen bg-slate-50 text-slate-800 font-sans pb-12">
      <header className="bg-white border-b border-slate-100 sticky top-0 z-50 shadow-sm">

          <div className="flex items-center gap-4"><ShieldCheck size={32} className="text-slate-700 hidden sm:block" /><div><h1 className="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">本社 集計ダッシュボード</h1><p className="text-xs font-bold text-slate-500">全営業所状況</p></div></div>

            <div className="flex items-center gap-2 bg-slate-50 px-3 py-2 rounded-xl shadow-inner border border-slate-200"><Calendar size={18} className="text-slate-500 hidden sm:block" /><input type="month" value={currentMonth} onChange={(e) => setCurrentMonth(e.target.value)} className="bg-transparent border-none text-sm font-bold text-slate-800 outline-none cursor-pointer" /></div>
            <button onClick={handleReset} className="text-xs font-bold text-slate-600 bg-slate-50 hover:bg-slate-100 border border-slate-200 px-3 py-2 rounded-xl">切替</button>
          </div>
        </div>
      </header>
      <main className="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">
        <Card className="p-5 shadow-md border-blue-100 bg-white">
          <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            <div>
              <div className="text-xs font-extrabold text-blue-600 tracking-widest uppercase mb-1">表示営業所</div>

                <h2 className="text-2xl font-bold text-slate-900 leading-none">{selectedBranchRow.branchName}</h2>
              </div>
              <div className="text-sm font-bold text-slate-500">{formatMonth(currentMonth)}度 / 登録案件 {selectedBranchRow.orderCount}件</div>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3">
              <div className="bg-slate-50 border border-slate-100 rounded-xl p-4"><div className="text-[11px] font-bold text-slate-500 mb-1">受注残</div><div className="text-xl font-bold text-slate-900">¥{yenK(selectedBranchRow.summary.rentalBacklogTotalAmt)}千円</div></div>
              <div className="bg-blue-50 border border-blue-100 rounded-xl p-4"><div className="text-[11px] font-bold text-blue-600 mb-1">レンタル新規</div><div className="text-xl font-bold text-blue-700">{selectedBranchRow.summary.rentalNew.doneCnt}/{selectedBranchRow.summary.rentalNew.forecastCnt}件</div></div>
              <div className="bg-rose-50 border border-rose-100 rounded-xl p-4"><div className="text-[11px] font-bold text-rose-600 mb-1">特価ベッド</div><div className="text-xl font-bold text-rose-700">{selectedBranchRow.summary.bed.doneCnt}/{selectedBranchRow.summary.bed.forecastCnt}台</div></div>
              <div className="bg-slate-50 border border-slate-100 rounded-xl p-4"><div className="text-[11px] font-bold text-slate-500 mb-1">住宅改修</div><div className="text-base font-bold text-slate-900">{selectedBranchRow.summary.renovation.doneCnt}/{selectedBranchRow.summary.renovation.forecastCnt}件</div><div className="text-sm font-bold text-blue-600">¥{yenK(selectedBranchRow.summary.renovation.forecastAmt)}千円</div></div>
              <div className="bg-slate-50 border border-slate-100 rounded-xl p-4"><div className="text-[11px] font-bold text-slate-500 mb-1">特定福祉用具</div><div className="text-base font-bold text-slate-900">{selectedBranchRow.summary.equipment.doneCnt}/{selectedBranchRow.summary.equipment.forecastCnt}件</div><div className="text-sm font-bold text-blue-600">¥{yenK(selectedBranchRow.summary.equipment.forecastAmt)}千円</div></div>
              <div className="bg-slate-50 border border-slate-100 rounded-xl p-4"><div className="text-[11px] font-bold text-slate-500 mb-1">その他</div><div className="text-xl font-bold text-slate-900">¥{yenK(selectedBranchRow.summary.otherSales.forecastAmt)}千円</div></div>
            </div>
          </Card>
        )}

        <Card className="p-4 shadow-md print:hidden">
          <button type="button" onClick={() => setShowRankings((open) => !open)} className="w-full flex items-center justify-between gap-3 text-left">
            <div>
              <div className="text-xs font-extrabold text-slate-500 tracking-widest uppercase mb-1">Ranking</div>
              <div className="text-lg font-bold text-slate-900">上位ランキング</div>
            </div>
            <div className={`px-4 py-2 rounded-xl font-bold text-sm ${showRankings ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-700'}`}>{showRankings ? '閉じる' : '開く'}</div>
          </button>
          {showRankings && (
            <div className="space-y-4 mt-4">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-slate-50 border border-slate-100 rounded-xl p-3">
                <RankingControlSelect label="期間" value={headRankingPeriod} onChange={setHeadRankingPeriod}>
                  {RANKING_PERIOD_OPTIONS.map((option) => <option key={option.value} value={option.value}>{option.label}</option>)}
                </RankingControlSelect>
                <RankingControlSelect label="営業員" value={headRankingStaffId} onChange={setHeadRankingStaffId}>
                  <option value="all">全員</option>
                  {headOfficeStaffOptions.map((option) => <option key={option.value} value={option.value}>{option.label}</option>)}
                </RankingControlSelect>
              </div>
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                <HeadOfficeRankingList title="新規レンタル件数 上位" rows={rankingRows.rentalNewCount} valueLabel="依頼数" valueFormat={(row) => `${row.summary.rentalNew.forecastCnt}件`} />
                <HeadOfficeRankingList title="新規レンタル金額合計 上位" rows={rankingRows.rentalNewAmount} valueLabel="新規のみ" valueFormat={(row) => `¥${yenK(row.summary.rentalNew.forecastAmt)}千円`} />
                <HeadOfficeRankingList title="特価ベッド依頼数 上位" rows={rankingRows.bedCount} valueLabel="依頼数" valueFormat={(row) => `${row.summary.bed.forecastCnt}台`} />
                <HeadOfficeRankingList title="特定福祉用具依頼数 上位" rows={rankingRows.equipmentCount} valueLabel="依頼数" valueFormat={(row) => `${row.summary.equipment.forecastCnt}件`} />
                <HeadOfficeRankingList title="特定福祉用具金額合計 上位" rows={rankingRows.equipmentAmount} valueLabel="金額合計" valueFormat={(row) => `¥${yenK(row.summary.equipment.forecastAmt)}千円`} />
                <HeadOfficeRankingList title="住宅改修依頼数 上位" rows={rankingRows.renovationCount} valueLabel="依頼数" valueFormat={(row) => `${row.summary.renovation.forecastCnt}件`} />
                <HeadOfficeRankingList title="住宅改修金額合計 上位" rows={rankingRows.renovationAmount} valueLabel="金額合計" valueFormat={(row) => `¥${yenK(row.summary.renovation.forecastAmt)}千円`} />
              </div>
            </div>
          )}
        </Card>

        <Card noPadding className="shadow-lg rounded-2xl">
          <div className="bg-slate-800 text-white px-5 py-3 font-bold text-sm uppercase tracking-widest flex items-center gap-3"><PieChart size={18} />営業所別状況</div>
          <div className="overflow-x-auto">
            <table className="w-full min-w-[1050px] table-fixed text-sm">
              <thead className="bg-slate-50 text-slate-700">
                <tr>
                  <th className="px-4 py-3 text-left w-[160px]">営業所</th>
                  <th className="px-4 py-3 text-center">受注残</th>
                  <th className="px-4 py-3 text-center">レンタル新規</th>
                  <th className="px-4 py-3 text-center">特価ベッド</th>
                  <th className="px-4 py-3 text-center">住宅改修</th>
                  <th className="px-4 py-3 text-center">特定福祉用具</th>
                  <th className="px-4 py-3 text-center">その他</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {branchRows.map((row) => <tr key={row.appId} className="hover:bg-blue-50/20"><td className="px-4 py-3 font-bold text-slate-900">{row.branchName}</td><td className="px-4 py-3 text-center font-bold">¥{yenK(row.summary.rentalBacklogTotalAmt)}千円</td><td className="px-4 py-3 text-center font-bold">{row.summary.rentalNew.doneCnt}/{row.summary.rentalNew.forecastCnt}件</td><td className="px-4 py-3 text-center font-bold">{row.summary.bed.doneCnt}/{row.summary.bed.forecastCnt}台</td><td className="px-4 py-3 text-center font-bold">{row.summary.renovation.doneCnt}/{row.summary.renovation.forecastCnt}件<br /><span className="text-blue-600">¥{yenK(row.summary.renovation.forecastAmt)}千円</span></td><td className="px-4 py-3 text-center font-bold">{row.summary.equipment.doneCnt}/{row.summary.equipment.forecastCnt}件<br /><span className="text-blue-600">¥{yenK(row.summary.equipment.forecastAmt)}千円</span></td><td className="px-4 py-3 text-center font-bold">¥{yenK(row.summary.otherSales.forecastAmt)}千円</td></tr>)}
                {!branchRows.length && <tr><td colSpan="7" className="px-4 py-8 text-center font-bold text-slate-500">営業所データはまだ登録されていません</td></tr>}
              </tbody>
            </table>
          </div>
        </Card>

        <Card noPadding className="shadow-lg rounded-2xl">
          <div className="bg-blue-600 text-white px-5 py-3 font-bold text-sm uppercase tracking-widest flex items-center gap-3"><Users size={18} />個人別状況</div>
          <div className="overflow-x-auto">
            <table className="w-full min-w-[1100px] table-fixed text-sm">
              <thead className="bg-slate-50 text-slate-700">
                <tr>
                  <th className="px-4 py-3 text-left w-[150px]">営業所</th>
                  <th className="px-4 py-3 text-left w-[120px]">担当</th>
                  <th className="px-4 py-3 text-center">受注残</th>
                  <th className="px-4 py-3 text-center">レンタル新規</th>
                  <th className="px-4 py-3 text-center">特価ベッド</th>
                  <th className="px-4 py-3 text-center">住宅改修</th>
                  <th className="px-4 py-3 text-center">特定福祉用具</th>
                  <th className="px-4 py-3 text-center">その他</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {staffRows.map((row) => <tr key={`${row.branchName}-${row.staffName}`} className="hover:bg-blue-50/20"><td className="px-4 py-3 font-bold text-slate-700">{row.branchName}</td><td className="px-4 py-3 font-bold text-slate-900">{row.staffName}</td><td className="px-4 py-3 text-center font-bold">¥{yenK(row.summary.rentalBacklogTotalAmt)}千円</td><td className="px-4 py-3 text-center font-bold">{row.summary.rentalNew.doneCnt}/{row.summary.rentalNew.forecastCnt}件</td><td className="px-4 py-3 text-center font-bold">{row.summary.bed.doneCnt}/{row.summary.bed.forecastCnt}台</td><td className="px-4 py-3 text-center font-bold">{row.summary.renovation.doneCnt}/{row.summary.renovation.forecastCnt}件<br /><span className="text-blue-600">¥{yenK(row.summary.renovation.forecastAmt)}千円</span></td><td className="px-4 py-3 text-center font-bold">{row.summary.equipment.doneCnt}/{row.summary.equipment.forecastCnt}件<br /><span className="text-blue-600">¥{yenK(row.summary.equipment.forecastAmt)}千円</span></td><td className="px-4 py-3 text-center font-bold">¥{yenK(row.summary.otherSales.forecastAmt)}千円</td></tr>)}
                {!staffRows.length && <tr><td colSpan="8" className="px-4 py-8 text-center font-bold text-slate-500">個人データはまだ登録されていません</td></tr>}
              </tbody>
            </table>
          </div>
        </Card>
      </main>
    </div>
  );
};

const App = () => {
  const [branchSetting, setBranchSetting] = useState(null);
  const [isChecking, setIsChecking] = useState(true);
  useEffect(() => {
    try {
      const saved = localStorage.getItem('solar_silver_branch_setting');
      if (saved) {
        const setting = JSON.parse(saved);
        if (setting?.accessKey) {
          if (isStoredHeadOfficeSetting(setting)) {
            const headOfficeSetting = createHeadOfficeSetting();
            localStorage.setItem('solar_silver_branch_setting', JSON.stringify(headOfficeSetting));
            setBranchSetting(headOfficeSetting);
          } else {
            setBranchSetting(setting);
          }
        } else {
          localStorage.removeItem('solar_silver_branch_setting');
        }
      }
    } catch (e) {
      console.error(e);
    }
    setIsChecking(false);
  }, []);
  if (isChecking) return <LoadingScreen />;
  if (!branchSetting) return <SetupScreen onComplete={setBranchSetting} />;
  if (branchSetting.isHeadOffice) return <HeadOfficeApp />;
  return <MainApp branchSetting={branchSetting} />;
};

createRoot(document.getElementById('root')).render(<App />);

</script>
  </body>
</html>
